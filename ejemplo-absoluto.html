<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>absoluto</title>
    <style>
        body {
            width: 80%;
            margin:0 auto;
        }
    </style>
</head>
<body>
    <h1>FUNCIONES CON PARÁMETRO Y RETURN</h1>
    <p>
        <label for="numero"></label>
        <input type="number" id="numero">
    </p>
    <p><button onclick="main()">Calcular</button></p>
    <p id="respuesta1"></p>
    <p id="respuesta2"></p>
    <script>
        const NUMERO = document.getElementById("numero");
        const RESPUESTA1 = document.getElementById("respuesta1");
        const RESPUESTA2 = document.getElementById("respuesta2");

        function esPar(num = 0) {
            return (num % 2 == 0) ? true : false;
        }

        function absoluto(num = 0) {
            let valor = (num < 0) ? num * -1: num;
            return valor //hace que la función regrese un valor
        }

        function main() {
            RESPUESTA1.innerText = `El valor absoluto es ${absoluto(Number(NUMERO.value))}`;
            alert(`El entero del numero ${(parseInt(NUMERO.value))} es ${esPar(parseInt(NUMERO.value))}`);
        }

    </script>
</body>
</html>
